<div class="page">
  <app-page-header [title]="heading() | t" />

  <div class="segmented">
    @for (item of ranges; track item) {
      <button type="button" [class.active]="range() === item" (click)="select(item)">
        {{ rangeKey[item] | t }}
      </button>
    }
  </div>

  @for (section of sections(); track section.title) {
    <section class="group">
      <h2><app-icon [name]="section.icon" [size]="20" /> {{ section.title | t }}</h2>
      <div class="tiles">
        @for (tile of section.tiles; track tile.field) {
          <div class="card tile">
            <span class="label">{{ tile.key | t }}</span>
            <strong>{{ loading() ? '…' : fmt(valueOf(tile.field), tile.frac) }}</strong>
          </div>
        }
      </div>
    </section>
  } @empty {
    <app-empty-state [text]="'Common.NoData' | t" />
  }
</div>
