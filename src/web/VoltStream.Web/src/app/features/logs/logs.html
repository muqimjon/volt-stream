<div class="page">
  <app-page-header [title]="'Web.Logs' | t">
    <button type="button" class="btn btn-ghost" [disabled]="loading()" (click)="load(1)">
      <app-icon name="refresh" [size]="18" />
    </button>
  </app-page-header>

  <app-date-field [label]="'Common.Date' | t" [value]="date()" (valueChange)="onDate($event)" />

  <div class="field">
    <label for="q">{{ 'Common.Search' | t }}</label>
    <input
      id="q"
      class="input"
      type="search"
      [value]="search()"
      (input)="search.set($any($event.target).value)"
      (change)="load(1)"
    />
  </div>

  @if (!logs().length && !loading()) {
    <app-empty-state [text]="'Common.NoData' | t" />
  }

  @for (log of logs(); track log.id) {
    <article class="card log" [class.failed]="!log.success">
      <button type="button" class="log-head" (click)="toggle(log.id)">
        <div>
          <strong>{{ log.action }}</strong>
          <small class="muted">{{ log.entityName }}{{ log.entityId ? ' #' + log.entityId : '' }}</small>
        </div>
        <div class="meta">
          <span>{{ log.username }}</span>
          <small class="muted">{{ fmtDateTime(log.timestamp) }}</small>
        </div>
      </button>
      @if (expanded() === log.id) {
        <pre class="details">{{ log.error || log.details || ('Common.NoData' | t) }}</pre>
      }
    </article>
  }

  @if (page() < totalPages()) {
    <button type="button" class="btn btn-block" [disabled]="loading()" (click)="loadMore()">
      {{ 'Web.LoadMore' | t }}
    </button>
  }
</div>
